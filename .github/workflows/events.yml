name: Update events
on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [brochures-changed]
  workflow_dispatch:
    inputs:
      reset_forms:
        description: "Make NEW forms for every event (old form links are dropped)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: events
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Read brochures and update events.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          FORM_HELPER_URL: ${{ secrets.FORM_HELPER_URL }}
          FORM_HELPER_KEY: ${{ secrets.FORM_HELPER_KEY }}
          RESET_FORMS: ${{ github.event.inputs.reset_forms }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/key.json"
          GOOGLE_SERVICE_ACCOUNT_JSON="$RUNNER_TEMP/key.json" python auto_update.py
      - name: Save changes
        run: |
          git config user.name "qq-bot"
          git config user.email "qq-bot@users.noreply.github.com"
          git add events.json processed_files.json needs_review.json
          git diff --cached --quiet || (git commit -m "Update events" && git push)
